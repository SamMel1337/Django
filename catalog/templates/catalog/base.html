<!DOCTYPE html>
{% load static %}
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Магазин{% endblock %}</title>
    <link rel="stylesheet" type="text/css" href="{% static 'css/css/bootstrap.css' %}">
</head>
<body>
    {% include 'catalog/menu.html' %}
    {% block form_block %}
    {% endblock %}


    <header>
        <h1>Магазин товаров</h1>
    </header>

    <main>
        {% block content %}
            {% block product_list %}
            {% endblock %}
        {% endblock %}
    </main>

    <footer>
        <p>&copy; 2024 Мой магазин</p>
    </footer>
    <script src="{% static 'js/bootstrap.js' %}"></script>
</body>
</html>

{% extends "base.html" %}

{% block title %}Список товаров{% endblock %}

{% block content %}
<h1>Список товаров</h1>
<ul>
    {% for product in products %}
        <li>
            <a href="{% url 'catalog:product_detail' product.pk %}">{{ product.name }}</a>
        </li>
    {% empty %}
        <li>Товары не найдены.</li>
    {% endfor %}
</ul>
{% endblock %}

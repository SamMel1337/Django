<!DOCTYPE html>
{% load static %}
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <title>{% block title %}Блог{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header>
        <h1>Мой блог</h1>
        <nav>
            <a href="{% url 'blog:list' %}">Главная</a> |
            <a href="{% url 'blog:create' %}">Создать статью</a>
        </nav>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <p>&copy; 2024 Мой блог</p>
    </footer>
</body>
</html>

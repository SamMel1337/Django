{% extends 'blog/base.html' %}

{% block title %}Список статей{% endblock %}

{% block content %}
<h2>Список статей</h2>

<ul>
{% for post in posts %}
    <li><a href="{% url 'blog:detail' post.pk %}">{{ post.title }}</a></li>
{% empty %}
    <li>Нет статей.</li>
{% endfor %}
</ul>

<a href="{% url 'blog:create' %}">Добавить новую статью</a>
{% endblock %}

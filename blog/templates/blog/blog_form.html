{% extends 'blog/base.html' %}

{% block title %}Форма статьи{% endblock %}

{% block content %}
<h2>{% if object %}Редактировать статью{% else %}Создать статью{% endif %}</h2>

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Сохранить</button>
</form>

<a href="{% url 'blog:list' %}">К списку статей</a>
{% endblock %}

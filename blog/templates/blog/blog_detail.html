{% extends 'blog/base.html' %}

{% block title %}{{ post.title }}{% endblock %}

{% block content %}
<h2>{{ post.title }}</h2>

{% if post.preview_image %}
<img src="{{ post.preview_image.url }}" alt="{{ post.title }}" style="max-width: 600px;">
{% endif %}

<p>{{ post.content }}</p>

<p>Просмотры: {{ post.views_count }}</p>

<a href="{% url 'blog:update' post.pk %}">Редактировать</a> |
<a href="{% url 'blog:delete' post.pk %}">Удалить</a> |
<a href="{% url 'blog:list' %}">К списку статей</a>
{% endblock %}
